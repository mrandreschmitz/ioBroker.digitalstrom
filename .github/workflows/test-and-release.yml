# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - '*'
    tags:
      # normal versions
      - "v?[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v?[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}


      - name: Install Dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test package files
        run: npm run test:package

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    needs: [check-and-lint]

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:js

      - name: Run integration tests # (linux/osx)
        if: startsWith(runner.OS, 'windows') == false
        run: DEBUG=testing:* npm run test:integration
      - name: Run integration tests # (windows)
        if: startsWith(runner.OS, 'windows')
        run: set DEBUG=testing:* & npm run test:integration

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Write permission is required to create the Github release. No id-token here:
    # this fork does not publish to npm, see the note at the release step below.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the annotated tag carries the release notes
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Extract the version and the release notes from the tag
        id: extract_release
        # The release notes are the message of the annotated tag, so they can be written
        # deliberately instead of reusing whatever the last commit message happened to be.
        # Falls back to the commit body for a lightweight tag.
        run: |
          VERSION="${{ github.ref }}"
          VERSION=${VERSION##*/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES=$(git tag -l --format='%(contents)' "v$VERSION")
          if [ -z "$NOTES" ]; then
            NOTES=$(git show -s --format=%b)
          fi
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "BODY<<$EOF_MARKER"
            echo "$NOTES"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"

      # Deliberately NO "npm publish" here. The npm package name iobroker.digitalstrom
      # belongs to the upstream project (maintainers bluefox and apollon77), so publishing
      # from this fork is not possible. Installation happens through the GitHub URL:
      #   iobroker url https://github.com/mrandreschmitz/ioBroker.digitalstrom
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.extract_release.outputs.VERSION }}
          draft: false
          # Prerelease versions create prereleases on Github
          prerelease: ${{ contains(steps.extract_release.outputs.VERSION, '-') }}
          body: ${{ steps.extract_release.outputs.BODY }}
